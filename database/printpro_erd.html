<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrintPro — Entity Relationship Diagram</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#e8ebf0;overflow:hidden;}
#toolbar{position:fixed;top:0;left:0;right:0;z-index:100;background:#fff;border-bottom:2px solid #d97706;display:flex;align-items:center;gap:10px;padding:8px 18px;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
#toolbar h1{font-size:15px;font-weight:700;color:#d97706;}
.tb-btn{background:#fff;border:1.5px solid #ccc;color:#555;padding:5px 12px;border-radius:5px;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif;transition:all .15s;}
.tb-btn:hover{background:#fef3e8;border-color:#d97706;color:#d97706;}
.tb-btn-pdf{background:#d97706;border:none;color:#fff;padding:5px 14px;border-radius:5px;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif;font-weight:600;transition:all .15s;}
.tb-btn-pdf:hover{background:#b45309;}.tb-btn-pdf:disabled{opacity:.5;cursor:not-allowed;}
#zoom-label{font-size:12px;color:#888;min-width:44px;text-align:center;}
.sep{width:1px;height:22px;background:#e5e7eb;margin:0 2px;}
#legend{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:11px;color:#666;}
.leg-item{display:flex;align-items:center;gap:5px;}
#pdf-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#d97706;color:#fff;padding:8px 20px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
#canvas-wrap{position:fixed;top:48px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab;background:#e8ebf0;}
#canvas-wrap.grabbing{cursor:grabbing;}
svg{position:absolute;top:0;left:0;pointer-events:none;}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;}

/* UML-style cards */
.table-card{position:absolute;background:#fff;border:1.5px solid #bbb;border-radius:5px;box-shadow:2px 3px 10px rgba(0,0,0,0.13);min-width:205px;cursor:move;user-select:none;transition:box-shadow .2s,border-color .2s;}
.table-card:hover{box-shadow:0 4px 18px rgba(217,119,6,0.2);border-color:#d97706;}
.table-card.selected{border-color:#d97706;box-shadow:0 0 0 2px rgba(217,119,6,0.3);}
.t-header{padding:7px 12px;border-radius:4px 4px 0 0;text-align:center;}
.t-name{font-size:13px;font-weight:700;color:#fff;letter-spacing:.3px;}
.t-pk-zone{padding:5px 12px 4px;border-bottom:1.5px solid #e5e7eb;background:#fffbf2;}
.t-fields-zone{padding:5px 12px 7px;background:#fff;border-radius:0 0 4px 4px;}
.t-row{display:flex;align-items:baseline;padding:2px 0;font-size:11.5px;gap:4px;}
.t-row .col-name{flex:1;color:#222;}
.t-row .col-type{color:#999;font-size:10.5px;font-family:'Courier New',monospace;}
.t-row.is-pk .col-name{font-weight:700;color:#b91c1c;text-decoration:underline;}
.t-row.is-fk .col-name{color:#1d4ed8;font-style:italic;}

.clr-auth    .t-header{background:#1d4ed8;}
.clr-finance .t-header{background:#d97706;}
.clr-order   .t-header{background:#15803d;}
.clr-content .t-header{background:#0e7490;}
.clr-device  .t-header{background:#6d28d9;}
.clr-credit  .t-header{background:#7c3aed;}
</style>
</head>
<body>
<div id="toolbar">
  <h1>◈ PrintPro ERD</h1>
  <div class="sep"></div>
  <button class="tb-btn" onclick="zoom(0.1)">+ Zoom In</button>
  <span id="zoom-label">100%</span>
  <button class="tb-btn" onclick="zoom(-0.1)">− Zoom Out</button>
  <button class="tb-btn" onclick="resetView()">↺ Reset</button>
  <div class="sep"></div>
  <button class="tb-btn-pdf" id="pdf-btn" onclick="downloadPDF()">⬇ Download PDF</button>
  <div class="sep"></div>
  <div id="legend">
    <div class="leg-item"><span style="font-size:11px;color:#b91c1c;font-weight:700;text-decoration:underline">PK</span>&nbsp;Primary Key</div>
    <div class="leg-item"><span style="font-size:11px;color:#1d4ed8;font-style:italic">FK</span>&nbsp;Foreign Key</div>
    <div class="leg-item">── 1 : 1 &nbsp;&nbsp; ──&lt; 1 : N</div>
  </div>
</div>
<div id="pdf-toast">📄 Generating PDF…</div>
<div id="canvas-wrap">
  <svg id="svg-lines" width="6000" height="3000"></svg>
  <div id="canvas"></div>
</div>
<script>
const groups = [
  {label:'AUTH',    x:32,  y:32, w:278, h:510, color:'#1d4ed8'},
  {label:'FINANCE', x:312, y:32, w:278, h:790, color:'#d97706'},
  {label:'ORDERS',  x:604, y:32, w:278, h:840, color:'#15803d'},
  {label:'ASSETS',  x:892, y:32, w:278, h:760, color:'#0e7490'},
  {label:'DEVICES', x:1180,y:32, w:278, h:640, color:'#6d28d9'},
];

const oneToOne = new Set(['clients-users','subscriptions-clients','client_credits-clients','invoices-orders']);

const relLabels = {
  'clients-users':'has profile','subscriptions-clients':'subscribes',
  'orders-clients':'placed by','orders-users':'assigned to','orders-print_specs':'uses spec',
  'order_status_history-orders':'tracks','order_status_history-users':'changed by',
  'files-clients':'owned by','files-orders':'attached to',
  'invoices-orders':'billed for','invoices-clients':'billed to',
  'device_jobs-devices':'runs on','device_jobs-orders':'processes',
  'notifications-users':'sent to','client_credits-clients':'credit for',
  'credit_transactions-clients':'belongs to','credit_transactions-orders':'linked to',
};

const tables = [
  {id:'users',label:'users',clr:'clr-auth',x:60,y:60,
   cols:[{n:'id',t:'integer',pk:true},{n:'name',t:'varchar'},{n:'email',t:'varchar'},{n:'password_hash',t:'varchar'},{n:'role',t:'enum'},{n:'subscription_plan',t:'enum'},{n:'status',t:'enum'},{n:'two_factor_enabled',t:'tinyint'},{n:'last_login_at',t:'timestamp'},{n:'created_at',t:'timestamp'},{n:'updated_at',t:'timestamp'}]},
  {id:'clients',label:'clients',clr:'clr-auth',x:60,y:370,
   cols:[{n:'id',t:'integer',pk:true},{n:'user_id',t:'integer',fk:'users'},{n:'business_name',t:'varchar'},{n:'industry',t:'varchar'},{n:'phone',t:'varchar'},{n:'address',t:'text'},{n:'created_at',t:'timestamp'}]},
  {id:'subscriptions',label:'subscriptions',clr:'clr-finance',x:340,y:60,
   cols:[{n:'id',t:'integer',pk:true},{n:'client_id',t:'integer',fk:'clients'},{n:'plan',t:'enum'},{n:'status',t:'enum'},{n:'amount',t:'decimal'},{n:'applied_on',t:'date'},{n:'renews_on',t:'date'},{n:'canceled_at',t:'timestamp'},{n:'updated_at',t:'timestamp'}]},
  {id:'client_credits',label:'client_credits',clr:'clr-credit',x:340,y:340,
   cols:[{n:'id',t:'integer',pk:true},{n:'client_id',t:'integer',fk:'clients'},{n:'balance',t:'decimal'},{n:'created_at',t:'timestamp'},{n:'updated_at',t:'timestamp'}]},
  {id:'invoices',label:'invoices',clr:'clr-finance',x:340,y:570,
   cols:[{n:'id',t:'integer',pk:true},{n:'invoice_number',t:'varchar'},{n:'order_id',t:'integer',fk:'orders'},{n:'client_id',t:'integer',fk:'clients'},{n:'amount',t:'decimal'},{n:'status',t:'enum'},{n:'issued_date',t:'date'},{n:'due_date',t:'date'},{n:'paid_at',t:'timestamp'},{n:'created_at',t:'timestamp'}]},
  {id:'print_specs',label:'print_specs',clr:'clr-order',x:630,y:60,
   cols:[{n:'id',t:'integer',pk:true},{n:'material_name',t:'varchar'},{n:'base_price',t:'decimal'},{n:'unit',t:'varchar'},{n:'status',t:'enum'},{n:'created_at',t:'timestamp'},{n:'updated_at',t:'timestamp'}]},
  {id:'orders',label:'orders',clr:'clr-order',x:630,y:310,
   cols:[{n:'id',t:'integer',pk:true},{n:'order_number',t:'varchar'},{n:'client_id',t:'integer',fk:'clients'},{n:'assigned_operator_id',t:'integer',fk:'users'},{n:'print_spec_id',t:'integer',fk:'print_specs'},{n:'product_type',t:'varchar'},{n:'quantity',t:'integer'},{n:'size_width',t:'decimal'},{n:'size_height',t:'decimal'},{n:'paper_weight',t:'varchar'},{n:'finish',t:'varchar'},{n:'print_sides',t:'enum'},{n:'bleed',t:'tinyint'},{n:'turnaround',t:'enum'},{n:'shipping_method',t:'enum'},{n:'unit_price',t:'decimal'},{n:'tax_rate',t:'decimal'},{n:'total_amount',t:'decimal'},{n:'status',t:'enum'},{n:'progress_pct',t:'tinyint'},{n:'due_date',t:'date'},{n:'notes',t:'text'},{n:'created_at',t:'timestamp'},{n:'updated_at',t:'timestamp'}]},
  {id:'credit_transactions',label:'credit_transactions',clr:'clr-credit',x:630,y:760,
   cols:[{n:'id',t:'integer',pk:true},{n:'client_id',t:'integer',fk:'clients'},{n:'transaction_type',t:'enum'},{n:'amount',t:'decimal'},{n:'description',t:'varchar'},{n:'order_id',t:'integer',fk:'orders'},{n:'created_at',t:'timestamp'}]},
  {id:'order_status_history',label:'order_status_history',clr:'clr-order',x:920,y:60,
   cols:[{n:'id',t:'integer',pk:true},{n:'order_id',t:'integer',fk:'orders'},{n:'changed_by',t:'integer',fk:'users'},{n:'status',t:'enum'},{n:'note',t:'text'},{n:'changed_at',t:'timestamp'}]},
  {id:'files',label:'files',clr:'clr-content',x:920,y:340,
   cols:[{n:'id',t:'integer',pk:true},{n:'client_id',t:'integer',fk:'clients'},{n:'order_id',t:'integer',fk:'orders'},{n:'filename',t:'varchar'},{n:'original_name',t:'varchar'},{n:'file_path',t:'varchar'},{n:'file_type',t:'varchar'},{n:'file_size_bytes',t:'bigint'},{n:'folder',t:'varchar'},{n:'starred',t:'tinyint'},{n:'trashed',t:'tinyint'},{n:'uploaded_at',t:'timestamp'}]},
  {id:'notifications',label:'notifications',clr:'clr-content',x:920,y:660,
   cols:[{n:'id',t:'integer',pk:true},{n:'user_id',t:'integer',fk:'users'},{n:'type',t:'varchar'},{n:'message',t:'text'},{n:'is_read',t:'tinyint'},{n:'created_at',t:'timestamp'}]},
  {id:'devices',label:'devices',clr:'clr-device',x:1210,y:60,
   cols:[{n:'id',t:'integer',pk:true},{n:'name',t:'varchar'},{n:'model',t:'varchar'},{n:'unit_number',t:'varchar'},{n:'status',t:'enum'},{n:'ink_level_pct',t:'tinyint'},{n:'sheets_per_hour',t:'integer'},{n:'job_queue_count',t:'tinyint'},{n:'last_maintenance',t:'date'},{n:'est_back_online',t:'date'},{n:'created_at',t:'timestamp'},{n:'updated_at',t:'timestamp'}]},
  {id:'device_jobs',label:'device_jobs',clr:'clr-device',x:1210,y:420,
   cols:[{n:'id',t:'integer',pk:true},{n:'device_id',t:'integer',fk:'devices'},{n:'order_id',t:'integer',fk:'orders'},{n:'started_at',t:'timestamp'},{n:'completed_at',t:'timestamp'}]},
  {id:'templates',label:'templates',clr:'clr-content',x:1210,y:620,
   cols:[{n:'id',t:'integer',pk:true},{n:'name',t:'varchar'},{n:'category',t:'varchar'},{n:'size',t:'varchar'},{n:'plan_required',t:'enum'},{n:'is_popular',t:'tinyint'},{n:'created_at',t:'timestamp'}]},
];

// ── Build DOM ─────────────────────────────────────────────────────────────────
const canvas  = document.getElementById('canvas');
const svgEl   = document.getElementById('svg-lines');
const wrap    = document.getElementById('canvas-wrap');
const cardEls = {};

tables.forEach(t => {
  const div = document.createElement('div');
  div.className = `table-card ${t.clr}`;
  div.id = 'tbl-' + t.id;
  div.style.left = t.x + 'px';
  div.style.top  = t.y + 'px';

  const pks  = t.cols.filter(c => c.pk);
  const rest = t.cols.filter(c => !c.pk);
  const pkRows    = pks.map(c  => `<div class="t-row is-pk"><span class="col-name">${c.n}</span><span class="col-type">: ${c.t}</span></div>`).join('');
  const fieldRows = rest.map(c => `<div class="t-row ${c.fk ? 'is-fk' : ''}"><span class="col-name">${c.n}</span><span class="col-type">: ${c.t}</span></div>`).join('');

  div.innerHTML = `
    <div class="t-header"><div class="t-name">${t.label}</div></div>
    <div class="t-pk-zone">${pkRows}</div>
    <div class="t-fields-zone">${fieldRows}</div>`;
  canvas.appendChild(div);
  cardEls[t.id] = div;
  makeDraggable(div);
});

// ── Relationships ─────────────────────────────────────────────────────────────
const rels = [];
tables.forEach(t => t.cols.forEach(c => { if(c.fk) rels.push({from: t.id, to: c.fk}); }));

// ── Helpers ───────────────────────────────────────────────────────────────────
function getBox(el) {
  const l = parseInt(el.style.left), tp = parseInt(el.style.top);
  const w = el.offsetWidth, h = el.offsetHeight;
  return {x: l+w/2, y: tp+h/2, l, t: tp, r: l+w, b: tp+h, w, h};
}

function ms(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, v));
  return el;
}

// ── Draw lines ────────────────────────────────────────────────────────────────
function drawLines() {
  svgEl.innerHTML = '';

  // Defs — crow's foot markers
  const defs = ms('defs', {});

  // Many-end: crow's foot (points left, refX at tip)
  const mMany = ms('marker', {id:'many', markerWidth:'14', markerHeight:'14', refX:'12', refY:'7', orient:'auto'});
  mMany.appendChild(ms('line', {x1:'2',y1:'3', x2:'12',y2:'7', stroke:'#444','stroke-width':'1.5'}));
  mMany.appendChild(ms('line', {x1:'2',y1:'11',x2:'12',y2:'7', stroke:'#444','stroke-width':'1.5'}));
  mMany.appendChild(ms('line', {x1:'2',y1:'7', x2:'12',y2:'7', stroke:'#444','stroke-width':'1.5'}));
  mMany.appendChild(ms('line', {x1:'6', y1:'3',x2:'6', y2:'11',stroke:'#444','stroke-width':'1.5'}));
  defs.appendChild(mMany);

  // One-end: single tick (at start, reversed)
  const mOne = ms('marker', {id:'one', markerWidth:'8', markerHeight:'14', refX:'2', refY:'7', orient:'auto-start-reverse'});
  mOne.appendChild(ms('line', {x1:'2',y1:'2',x2:'2',y2:'12', stroke:'#444','stroke-width':'1.5'}));
  defs.appendChild(mOne);

  svgEl.appendChild(defs);

  // Group panels
  groups.forEach(g => {
    svgEl.appendChild(ms('rect', {x:g.x, y:g.y, width:g.w, height:g.h, rx:8,
      fill: g.color+'14', stroke: g.color+'66', 'stroke-width':'1.5', 'stroke-dasharray':'6,3'}));
    const lbl = ms('text', {x:g.x+10, y:g.y+15, 'font-size':'9.5', 'font-family':'Inter,sans-serif',
      'font-weight':'700', 'letter-spacing':'1', fill: g.color+'cc'});
    lbl.textContent = g.label;
    svgEl.appendChild(lbl);
  });

  // Lines
  rels.forEach(r => {
    const fromEl = cardEls[r.from], toEl = cardEls[r.to];
    if(!fromEl || !toEl) return;
    const a = getBox(fromEl), b = getBox(toEl);
    let x1,y1,x2,y2;
    if(Math.abs(a.x-b.x) > Math.abs(a.y-b.y)) {
      x1=a.x<b.x?a.r:a.l; y1=a.y; x2=a.x<b.x?b.l:b.r; y2=b.y;
    } else {
      x1=a.x; y1=a.y<b.y?a.b:a.t; x2=b.x; y2=a.y<b.y?b.t:b.b;
    }
    const cx = (x1+x2)/2;
    const is11 = oneToOne.has(`${r.from}-${r.to}`);
    svgEl.appendChild(ms('path', {
      d: `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`,
      fill:'none', stroke:'#555', 'stroke-width':'1.5',
      'marker-start': 'url(#one)',
      'marker-end':   is11 ? 'url(#one)' : 'url(#many)'
    }));

    // Relationship label
    const lbl = relLabels[`${r.from}-${r.to}`];
    if(lbl) {
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      const w2 = lbl.length * 4.5 + 8;
      svgEl.appendChild(ms('rect', {x:mx-w2/2, y:my-8, width:w2, height:13, rx:3, fill:'#fff', stroke:'#d1d5db','stroke-width':'1'}));
      const t2 = ms('text', {x:mx, y:my+2, 'font-size':'9', 'font-family':'Inter,sans-serif',
        'font-style':'italic', fill:'#6b7280', 'text-anchor':'middle'});
      t2.textContent = lbl;
      svgEl.appendChild(t2);
    }
  });
}

// ── Drag ──────────────────────────────────────────────────────────────────────
function makeDraggable(el) {
  let ox,oy,sx,sy,dragging=false;
  el.addEventListener('mousedown', e => {
    if(e.button!==0) return;
    dragging=true; ox=e.clientX; oy=e.clientY;
    sx=parseInt(el.style.left); sy=parseInt(el.style.top);
    el.classList.add('selected'); e.stopPropagation();
  });
  document.addEventListener('mousemove', e => {
    if(!dragging) return;
    el.style.left=(sx+(e.clientX-ox)/scale)+'px';
    el.style.top =(sy+(e.clientY-oy)/scale)+'px';
    drawLines();
  });
  document.addEventListener('mouseup', () => {
    dragging=false;
    document.querySelectorAll('.table-card').forEach(c=>c.classList.remove('selected'));
  });
}

// ── Pan & Zoom ────────────────────────────────────────────────────────────────
let scale=1, panX=40, panY=40;
let panning=false, px=0,py=0,ptx=0,pty=0;

function applyTransform() {
  canvas.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
  svgEl.style.transform  = `translate(${panX}px,${panY}px) scale(${scale})`;
  document.getElementById('zoom-label').textContent = Math.round(scale*100)+'%';
}

wrap.addEventListener('mousedown', e => {
  if(e.target!==wrap && e.target!==svgEl) return;
  panning=true; px=e.clientX; py=e.clientY; ptx=panX; pty=panY;
  wrap.classList.add('grabbing');
});
document.addEventListener('mousemove', e => {
  if(!panning) return;
  panX=ptx+(e.clientX-px); panY=pty+(e.clientY-py); applyTransform();
});
document.addEventListener('mouseup', () => { panning=false; wrap.classList.remove('grabbing'); });
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  scale = Math.min(2, Math.max(0.25, scale+(e.deltaY<0?0.1:-0.1)));
  applyTransform();
}, {passive:false});

function zoom(d) { scale=Math.min(2,Math.max(0.25,scale+d)); applyTransform(); }
function resetView() { scale=0.62; panX=30; panY=30; applyTransform(); drawLines(); }

// ── PDF Export ────────────────────────────────────────────────────────────────
async function downloadPDF() {
  const btn=document.getElementById('pdf-btn'), toast=document.getElementById('pdf-toast');
  btn.disabled=true; btn.textContent='⏳ Generating…'; toast.style.opacity='1';
  const sv=scale, spx=panX, spy=panY;
  let mnX=Infinity,mnY=Infinity,mxX=-Infinity,mxY=-Infinity;
  document.querySelectorAll('.table-card').forEach(el=>{
    const l=parseInt(el.style.left),t=parseInt(el.style.top);
    mnX=Math.min(mnX,l); mnY=Math.min(mnY,t);
    mxX=Math.max(mxX,l+el.offsetWidth); mxY=Math.max(mxY,t+el.offsetHeight);
  });
  const pad=60, W=1587, H=1123;
  scale=Math.min(W/(mxX-mnX+pad*2), H/(mxY-mnY+pad*2), 1);
  panX=-( mnX-pad)*scale; panY=-(mnY-pad)*scale;
  applyTransform(); drawLines();
  const lw=document.getElementById('canvas-wrap'), os=lw.style.cssText;
  lw.style.cssText=`position:fixed;top:0;left:0;width:${W}px;height:${H}px;overflow:hidden;z-index:9999;`;
  await new Promise(r=>setTimeout(r,400));
  try {
    const c=await html2canvas(lw,{backgroundColor:'#e8ebf0',scale:2,useCORS:true,logging:false,width:W,height:H});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a3'});
    pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,420,297);
    pdf.setFontSize(7); pdf.setTextColor(150);
    pdf.text('PrintPro ERD  |  Generated '+new Date().toLocaleDateString(),10,294);
    pdf.save('printpro_erd.pdf');
  } catch(e){ alert('PDF error: '+e.message); }
  finally {
    lw.style.cssText=os;
    scale=sv; panX=spx; panY=spy;
    applyTransform(); drawLines();
    btn.disabled=false; btn.innerHTML='⬇ Download PDF'; toast.style.opacity='0';
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
setTimeout(()=>{ drawLines(); resetView(); }, 100);
</script>
</body>
</html>
